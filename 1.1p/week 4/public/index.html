<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIT 725 3.2P - Plant Gallery</title>
  <meta name="description" content="Plant gallery web app for SIT 725 3.2P">

  <!-- Compiled and minified CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Custom Style Sheet-->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <div class="nav-wrapper navbar-size">
      <a href="#" class="brand-logo"><img class="user-image-size" src="images/leaf-logo.jpg" /></a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a target="_blank" href="https://github.com/">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="main-body">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 id="heading">Welcome to the Plant Gallery</h1>
          <p class="flow-text">A small demo app that fetches plant data from a REST endpoint and
            renders it using Materialize cards.</p>
        </div>
        <div class="col s12 center-align">
          <img class="materialboxed materialboxed-image" src="images/hero-plant.jpg">
        </div>
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn click-me-button modal-trigger" id="clickMeButton" data-target="modal1">
            <i class="material-icons left">local_florist</i>Add a Plant
          </a>
        </div>
      </div>

      <!-- Cards are appended here dynamically by scripts.js after fetching /api/plants -->
      <div class="row" id="card-section"></div>
    </div>

    <!-- Modal Structure -->
    <div id="modal1" class="modal modal-fixed-footer">
      <div class="row modal-content">
        <form class="col s12">
          <div class="row">
            <div class="input-field col s6">
              <input id="plant_name" type="text" class="validate">
              <label for="plant_name">Plant Name</label>
            </div>
            <div class="input-field col s6">
              <input id="care_level" type="text" class="validate">
              <label for="care_level">Care Level</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <input id="notes" type="text" class="validate">
              <label for="notes">Notes</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12 center-align">
              <a class="waves-effect waves-light btn" id="formSubmit">Submit</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <!-- Compiled and minified JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
